name: Node.js Package

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".nvmrc"
      - run: yarn install --immutable
      - run: yarn test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v5
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org/
      - name: Update npm to latest
        run: npm install -g npm@latest
      - run: yarn install --immutable
      - name: Report Rollouts deployment start
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CHANGE_MONITOR_ENV: "publish-npm"
          CHANGE_MONITOR_SERVICE: "home-assistant-js-websocket"
          CHANGE_MONITOR_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          CHANGE_MONITOR_ACTOR: "github-actions:${{ github.workflow }}:${{ github.job }}:home-assistant-js-websocket:publish-npm"
        run: |
          export DEPLOY_VERSION="$(git rev-parse HEAD)"
          bash .github/scripts/rollouts-reporter.sh bootstrap
          bash .github/scripts/rollouts-reporter.sh start
      - run: npm publish --provenance
      - name: Report Rollouts deployment finish
        if: always()
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CHANGE_MONITOR_ENV: "publish-npm"
          CHANGE_MONITOR_SERVICE: "home-assistant-js-websocket"
          CHANGE_MONITOR_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          CHANGE_MONITOR_ACTOR: "github-actions:${{ github.workflow }}:${{ github.job }}:home-assistant-js-websocket:publish-npm"
          CHANGE_MONITOR_OUTCOME: ${{ job.status }}
        run: bash .github/scripts/rollouts-reporter.sh finish
